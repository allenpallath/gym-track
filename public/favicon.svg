<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Same jelly recipe as the app: light top, saturated core, deeper base. -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f6b7"/>
      <stop offset="0.3" stop-color="#c9e85f"/>
      <stop offset="0.72" stop-color="#c9e85f"/>
      <stop offset="1" stop-color="#adc951"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.16" r="0.5" fx="0.5" fy="0.1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
